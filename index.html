<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <title>Claude Rate Limit Checker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            min-height: 100vh;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 12px 0;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 20px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .icon-btn:active {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Status Card */
        .status-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ef4444;
            flex-shrink: 0;
        }

        .status-indicator.connected {
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
        }

        #statusText {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Limit Cards */
        .limits-container {
            display: none;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
        }

        .limit-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
        }

        .limit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .limit-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .limit-value {
            font-size: 18px;
            font-weight: 600;
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            border-radius: 8px;
            transition: width 0.3s ease;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            width: 0%;
        }

        .progress-fill.warning {
            background: linear-gradient(90deg, #f59e0b, #ef4444);
        }

        .reset-time {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        /* Buttons */
        .primary-btn, .secondary-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            transition: transform 0.1s, opacity 0.2s;
        }

        .primary-btn:active, .secondary-btn:active {
            transform: scale(0.98);
        }

        .primary-btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
        }

        .primary-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* Info Box */
        .info-box {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
            display: none;
        }

        .info-box p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: flex-end;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-header h2 {
            font-size: 20px;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 8px;
            width: 36px;
            height: 36px;
            font-size: 18px;
            cursor: pointer;
            color: white;
        }

        .modal-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 16px;
            -webkit-appearance: none;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .form-group small {
            display: block;
            margin-top: 6px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }

        .form-group a {
            color: #3b82f6;
            text-decoration: none;
        }

        /* Loading Overlay */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
        }

        .loading-overlay.active {
            display: flex;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container { padding: 12px; }
            .header h1 { font-size: 18px; }
            .limit-card { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>⚡ Rate Limit Checker</h1>
            <button class="icon-btn" onclick="toggleSettings()">⚙️</button>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- API Key Status -->
            <div class="status-card" id="apiStatus">
                <div class="status-indicator" id="statusIndicator"></div>
                <span id="statusText">ไม่ได้เชื่อมต่อ</span>
            </div>

            <!-- Rate Limit Cards -->
            <div class="limits-container" id="limitsContainer">
                <div class="limit-card">
                    <div class="limit-header">
                        <span class="limit-label">📡 Requests</span>
                        <span class="limit-value" id="requestsValue">0/0</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="requestsProgress"></div>
                    </div>
                    <div class="reset-time" id="requestsReset">-</div>
                </div>

                <div class="limit-card">
                    <div class="limit-header">
                        <span class="limit-label"> Tokens</span>
                        <span class="limit-value" id="tokensValue">0/0</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="tokensProgress"></div>
                    </div>
                    <div class="reset-time" id="tokensReset">-</div>
                </div>
            </div>

            <!-- Test Button -->
            <button class="primary-btn" id="testBtn" onclick="testConnection()" disabled>
                ทดสอบการเชื่อมต่อ
            </button>

            <!-- Usage Info -->
            <div class="info-box" id="infoBox">
                <p>💡 ทดสอบ API เพื่อดู rate limit ของคุณ</p>
            </div>
        </main>

        <!-- Settings Modal -->
        <div class="modal" id="settingsModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>⚙️ Settings</h2>
                    <button class="close-btn" onclick="toggleSettings()">✕</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="apiKey">Groq API Key</label>
                        <input type="password" id="apiKey" placeholder="gsk_xxxxxxxxxxxx">
                        <small>รับฟรีที่ <a href="https://console.groq.com/keys" target="_blank">console.groq.com</a></small>
                    </div>
                    <button class="primary-btn" onclick="saveSettings()">💾 บันทึก</button>
                    <button class="secondary-btn" onclick="clearSettings()">🗑️ ลบ API Key</button>
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <p>กำลังโหลด...</p>
        </div>
    </div>

    <script>
        // Constants
        const STORAGE_KEY = 'groq_api_settings';
        const API_BASE = 'https://api.groq.com/openai/v1';

        // State
        let apiKey = '';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            updateUI();
        });

        // Load settings from localStorage
        function loadSettings() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const settings = JSON.parse(saved);
                    apiKey = settings.apiKey || '';
                    if (apiKey) {
                        document.getElementById('apiKey').value = apiKey;
                    }
                } catch (e) {
                    console.error('Error loading settings:', e);
                }
            }
        }

        // Save settings to localStorage
        function saveSettings() {
            const inputKey = document.getElementById('apiKey').value.trim();
            
            if (!inputKey) {
                alert('กรุณาใส่ API Key');
                return;
            }
            
            apiKey = inputKey;
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ apiKey }));
            toggleSettings();
            updateUI();
            alert('✅ บันทึก settings เรียบร้อยแล้ว');
        }

        // Clear settings
        function clearSettings() {
            if (confirm('ต้องการลบ API Key หรือไม่?')) {
                localStorage.removeItem(STORAGE_KEY);
                apiKey = '';
                document.getElementById('apiKey').value = '';
                document.getElementById('limitsContainer').style.display = 'none';
                document.getElementById('infoBox').style.display = 'none';
                updateUI();
                alert('🗑️ ลบ API Key แล้ว');
            }
        }

        // Toggle settings modal
        function toggleSettings() {
            const modal = document.getElementById('settingsModal');
            modal.classList.toggle('active');
        }

        // Update UI based on state
        function updateUI() {
            const statusIndicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            const testBtn = document.getElementById('testBtn');
            
            if (apiKey) {
                statusIndicator.classList.add('connected');
                statusText.textContent = 'มี API Key - พร้อมใช้งาน';
                testBtn.disabled = false;
            } else {
                statusIndicator.classList.remove('connected');
                statusText.textContent = 'ไม่ได้เชื่อมต่อ - กรุณาตั้งค่า API Key';
                testBtn.disabled = true;
            }
        }

        // Test connection and get rate limits
        async function testConnection() {
            if (!apiKey) {
                alert('กรุณาตั้งค่า API Key ก่อน');
                toggleSettings();
                return;
            }
            
            showLoading(true);
            
            try {
                const response = await fetch(`${API_BASE}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        messages: [{ role: 'user', content: 'Hi' }],
                        max_tokens: 1
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error?.message || `HTTP ${response.status}: ${response.statusText}`);
                }
                
                // Get rate limit headers from Groq
                const headers = {
                    requestsLimit: response.headers.get('x-ratelimit-limit-requests'),
                    requestsRemaining: response.headers.get('x-ratelimit-remaining-requests'),
                    requestsReset: response.headers.get('x-ratelimit-reset-requests'),
                    tokensLimit: response.headers.get('x-ratelimit-limit-tokens'),
                    tokensRemaining: response.headers.get('x-ratelimit-remaining-tokens'),
                    tokensReset: response.headers.get('x-ratelimit-reset-tokens')
                };
                
                // Update UI with rate limits
                updateRateLimitDisplay(headers);
                
                // Update status
                document.getElementById('statusText').textContent = '✅ เชื่อมต่อสำเร็จ';
                document.getElementById('infoBox').style.display = 'block';
                
            } catch (error) {
                console.error('Error:', error);
                alert('❌ เกิดข้อผิดพลาด: ' + error.message);
            } finally {
                showLoading(false);
            }
        }

        // Update rate limit display
        function updateRateLimitDisplay(headers) {
            const limitsContainer = document.getElementById('limitsContainer');
            limitsContainer.style.display = 'flex';
            
            // Requests
            if (headers.requestsLimit && headers.requestsRemaining) {
                const limit = parseInt(headers.requestsLimit);
                const remaining = parseInt(headers.requestsRemaining);
                const used = limit - remaining;
                const percent = Math.min((used / limit) * 100, 100);
                
                document.getElementById('requestsValue').textContent = `${used}/${limit}`;
                
                const progressEl = document.getElementById('requestsProgress');
                progressEl.style.width = `${percent}%`;
                progressEl.classList.toggle('warning', percent > 80);
                
                if (headers.requestsReset) {
                    const seconds = Math.ceil(parseFloat(headers.requestsReset));
                    document.getElementById('requestsReset').textContent = `️ รีเซ็ตใน: ${seconds} วินาที`;
                }
            }
            
            // Tokens
            if (headers.tokensLimit && headers.tokensRemaining) {
                const limit = parseInt(headers.tokensLimit);
                const remaining = parseInt(headers.tokensRemaining);
                const used = limit - remaining;
                const percent = Math.min((used / limit) * 100, 100);
                
                document.getElementById('tokensValue').textContent = `${formatNumber(used)}/${formatNumber(limit)}`;
                
                const progressEl = document.getElementById('tokensProgress');
                progressEl.style.width = `${percent}%`;
                progressEl.classList.toggle('warning', percent > 80);
                
                if (headers.tokensReset) {
                    const seconds = Math.ceil(parseFloat(headers.tokensReset));
                    document.getElementById('tokensReset').textContent = `⏱️ รีเซ็ตใน: ${seconds} วินาที`;
                }
            }
        }

        // Format large numbers
        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toLocaleString();
        }

        // Show/hide loading
        function showLoading(show) {
            const overlay = document.getElementById('loadingOverlay');
            if (show) {
                overlay.classList.add('active');
            } else {
                overlay.classList.remove('active');
            }
        }

        // Close modal when clicking outside
        document.getElementById('settingsModal').addEventListener('click', (e) => {
            if (e.target.id === 'settingsModal') {
                toggleSettings();
            }
        });
    </script>
</body>
</html>
